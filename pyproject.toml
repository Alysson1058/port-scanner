[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "port-scanner"
version = "0.2.0"
description = "Scanner concorrente TCP/UDP com IPv4, IPv6 e domínios"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
port-scanner = "port_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["port_scanner*"]
